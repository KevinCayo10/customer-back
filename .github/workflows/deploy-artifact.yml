name: Deploy artifact

on:
  repository_dispatch:
    types: [deploy-artifact-event]

jobs:
  ########################################################
  # JOB 1 - Download artifact and prepare Docker context
  ########################################################

  dowlonad-artifact-job:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      actions: read

    steps:
      ########################################################
      # 1 - Retrieve parameters from payload
      ########################################################

      - name: Retrieve Payload
        run: |
          echo "Checksum: ${{ github.event.client_payload.checksum }}"
          echo "Artifact: ${{ github.event.client_payload.artifact_name }}"

      ########################################################
      # 2 - Download artifact
      ########################################################

      - name: Download artifact
        uses: dawidd6/action-download-artifact@v9
        id: download-artifact
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: public-jar.yml
          workflow_conclusion: success
          name: artifactjar
          path: /tmp/artifactjar

      ########################################################
      # 3 - Display downloaded files
      ########################################################

      - name: Display structure of downloaded files
        run: |
          ls -R /tmp/artifactjar

      ########################################################
      # 4 - Calculate checksum
      ########################################################

      - name: Checksum of downloaded artifact
        id: hash
        run: |
          HASH=$(sha1sum "/tmp/artifactjar/${{ github.event.client_payload.artifact_name }}" | awk '{ print $1 }')
          echo "HASH=$HASH" >> "$GITHUB_ENV"

          echo "Calculated checksum:"
          echo "$HASH"

      ########################################################
      # 5 - Compare checksum
      ########################################################

      - name: Compare checksum
        run: |
          echo "Expected checksum:"
          echo "${{ github.event.client_payload.checksum }}"

          echo "Calculated checksum:"
          echo "${{ env.HASH }}"

          if [ "${{ env.HASH }}" == "${{ github.event.client_payload.checksum }}" ]; then
            echo "The checksums are equal! Successfully completed."
          else
            echo "The checksums are NOT equal! Operation failed."
            exit 1
          fi

      ########################################################
      # 6 - Checkout source code
      ########################################################

      - name: Checkout source
        uses: actions/checkout@v7

      ########################################################
      # 7 - Prepare Docker build context
      ########################################################

      - name: Prepare Docker build context
        run: |
          echo "Current directory:"
          ls -la

          echo "Preparing Docker build context..."

          cp ".docker/Dockerfile" "/tmp/Dockerfile"

          cp "/tmp/artifactjar/${{ github.event.client_payload.artifact_name }}" \
             "/tmp/${{ github.event.client_payload.artifact_name }}"

          echo "Contents of /tmp:"
          ls -la /tmp

      ########################################################
      # 8 - Upload Docker build context
      ########################################################

      - name: Upload Docker build context
        uses: actions/upload-artifact@v7
        with:
          name: dockerBuildContext
          path: |
            /tmp/Dockerfile
            /tmp/${{ github.event.client_payload.artifact_name }}

  ########################################################
  # JOB 2 - Build and push Docker image
  ########################################################

  docker-job:
    needs:
      - dowlonad-artifact-job

    runs-on: ubuntu-latest

    permissions:
      contents: read
      actions: read
      packages: write

    steps:
      ########################################################
      # 1 - Set up QEMU
      ########################################################

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      ########################################################
      # 2 - Set up Docker Buildx
      ########################################################

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      ########################################################
      # 3 - Login to GitHub Container Registry
      ########################################################

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      ########################################################
      # 4 - Download Docker build context
      ########################################################

      - name: Download Docker build context
        uses: actions/download-artifact@v8
        with:
          name: dockerBuildContext
          path: ./dockerBuildContext

      ########################################################
      # 5 - Display structure
      ########################################################

      - name: Display structure
        run: |
          ls -R dockerBuildContext

      ########################################################
      # 6 - Convert repository owner to lowercase
      ########################################################

      - name: Set lowercase image name
        run: |
          echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/cutomer-back" >> "$GITHUB_ENV"

          echo "Docker image:"
          echo "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/cutomer-back"

      ########################################################
      # 7 - Build and push Docker image
      ########################################################

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: ./dockerBuildContext
          file: ./dockerBuildContext/Dockerfile

          build-args: |
            JAR_FILE=${{ github.event.client_payload.artifact_name }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}

          push: true

          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
